<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1923">
  <title>Project G-Code Tutorial — Cert Practice</title>
  <style>
    :root {
      --c-bg: #0F1923;
      --c-surface: #172130;
      --c-border: #2A3D52;
      --c-text: #E8EDF2;
      --c-text-2: #9BAFC4;
      --c-primary: #1A6B5C;
      --c-primary-l: #22876E;
      --c-accent: #F5A623;
      --c-correct: #20C997;
      --c-wrong: #FF6B81;
      --r: 14px;
      --f-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(240,160,64,0.10), transparent 18rem),
        radial-gradient(circle at 85% 15%, rgba(32,201,151,0.12), transparent 22rem),
        linear-gradient(160deg, #07131D, #0F2630, #071018);
      color: var(--c-text);
      font-family: var(--f-body);
      line-height: 1.55;
    }
    .cert-root { padding: 1rem; max-width: 960px; margin: 0 auto; }
    .cert-home__title { font-size: 1.25rem; font-weight: 800; margin: 0.5rem 0 0.75rem; letter-spacing: 0.2px; }
    .cert-card {
      border: 1px solid var(--c-border);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border-radius: var(--r);
      padding: 1rem;
      margin: 0.5rem 0;
    }
    .cert-card__name { font-weight: 800; font-size: 1.05rem; }
    .cert-card__meta { opacity: 0.85; font-size: 0.9rem; margin-top: 0.25rem; }
    .cert-card__hint { font-size: 0.85rem; opacity: 0.7; margin-top: 0.35rem; }
    .cert-btn {
      display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.7rem;
      border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
      color: #ECF7F5; padding: 0.6rem 0.9rem; border-radius: 12px; font-weight: 700; cursor: pointer;
    }
    .cert-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .cert-quiz {}
    .cert-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
    .cert-progress { opacity: 0.9; font-weight: 800; }
    .cert-question { font-weight: 700; font-size: 1.05rem; margin: 0.5rem 0 0.6rem; }
    .cert-answers { display: grid; gap: 0.5rem; }
    .cert-answer {
      text-align: left; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05);
      color: var(--c-text); padding: 0.75rem 0.9rem; border-radius: 14px; font-weight: 600; cursor: pointer;
    }
    .cert-answer.correct { border-color: var(--c-correct); background: rgba(32,201,151,0.14); }
    .cert-answer.wrong { border-color: var(--c-wrong); background: rgba(255,107,129,0.12); }
    .cert-answer:disabled { cursor: not-allowed; }
    .cert-feedback { margin-top: 0.7rem; min-height: 1.4rem; font-weight: 700; }
    .cert-nav { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 1rem; }
    .cert-result { text-align: center; padding: 1.2rem 1rem; }
    .cert-result__score { font-size: 2.2rem; font-weight: 900; }
    .cert-result__sub { opacity: 0.85; margin-top: 0.25rem; }
    .cert-controversy { font-size: 0.82rem; opacity: 0.75; margin-top: 1rem; }
    @media (max-width: 640px) {
      .cert-root { padding: 1rem; }
      .cert-btn { width: 100%; justify-content: center; }
      .cert-nav { flex-direction: column; }
    }
  </style>
</head>
<body>

<section class="screen active cert-root" id="screen-cert-practice">
  <div id="cert-app"></div>
</section>

<script>
(function() {
  'use strict';
  const bank = window.CERT_PRACTICE_BANK;
  async function init() {
    let data = bank;
    if (!data || !data.questions || !data.questions.length) {
      try {
        const res = await fetch('data/cert-practice-bank.json', {cache: 'no-store'});
        if (res.ok) data = await res.json();
      } catch {}
    }
    const app = document.getElementById('cert-app');
    if (!app || !data?.questions?.length) {
      app.innerHTML = '<div class="cert-card">Practice bank failed to load.</div>';
      return;
    }
    const state = {
      mode: 'home',
      domain: null,
      questions: [],
      index: 0,
      score: 0,
      answered: false,
      chosen: null
    };
    const setMode = (mode) => { state.mode = mode; };
    const setDomain = (id) => {
      state.domain = id;
      state.questions = data.questions.filter(q => q.domain === id);
      state.index = 0;
      state.score = 0;
      state.answered = false;
      state.chosen = null;
    };
    const current = () => state.questions[state.index];
    const countForDomain = (id) => data.questions.filter(q => q.domain === id).length;
    const escapeHtml = (str) => String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    function renderHome() {
      setMode('home');
      app.innerHTML = `
        <div class="cert-home__title">${escapeHtml(data.meta?.title || 'Certification Practice Test')}</div>
        <div class="cert-card">
          <div class="cert-card__name">Domains</div>
          <div class="cert-card__meta">${data.domains.length} domains · ${data.questions.length} seed questions</div>
          <div class="cert-controversy">${escapeHtml(data.meta?.controversy_note || '')}</div>
        </div>
        ${data.domains.map(domain => `
          <div class="cert-card">
            <div class="cert-card__name">${escapeHtml(domain.name)}</div>
            <div class="cert-card__meta">${domain.exam_style || ''} · ${countForDomain(domain.id)} questions available</div>
            <div class="cert-card__hint">${escapeHtml(domain.description || '')}</div>
            <button class="cert-btn" type="button" data-start="${domain.id}">Start practice →</button>
          </div>
        `).join('')}
      `;
      app.querySelectorAll('button[data-start]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.start;
          if (!countForDomain(id)) return;
          setDomain(id);
          renderQuiz();
        });
      });
    }

    function renderQuiz() {
      setMode('quiz');
      const q = current();
      state.answered = false;
      state.chosen = null;
      app.innerHTML = `
        <div class="cert-quiz">
          <div class="cert-top">
            <div class="cert-progress">Question ${state.index + 1} of ${state.questions.length}</div>
            <button class="cert-btn" type="button" id="cert-home-btn">Exit</button>
          </div>
          <div class="cert-question">${escapeHtml(q.question)}</div>
          <div class="cert-answers" id="cert-answers"></div>
          <div class="cert-feedback" id="cert-feedback"></div>
          <div class="cert-nav">
            <button class="cert-btn" id="cert-next" type="button" disabled>Next →</button>
          </div>
          <div class="cert-controversy">${escapeHtml(data.meta?.controversy_note || '')}</div>
        </div>
      `;
      document.getElementById('cert-home-btn').addEventListener('click', renderHome);
      const answersEl = document.getElementById('cert-answers');
      q.answers.forEach((text, idx) => {
        const btn = document.createElement('button');
        btn.className = 'cert-answer';
        btn.type = 'button';
        btn.id = 'cert-answer-' + idx;
        btn.textContent = text;
        btn.addEventListener('click', () => selectAnswer(idx, btn));
        answersEl.appendChild(btn);
      });
      const nextBtn = document.getElementById('cert-next');
      nextBtn.addEventListener('click', () => {
        if (state.index + 1 < state.questions.length) {
          state.index += 1;
          renderQuiz();
        } else {
          renderResult();
        }
      });
    }

    function selectAnswer(chosenIdx, btnEl) {
      if (state.answered) return;
      state.answered = true;
      state.chosen = chosenIdx;
      const q = current();
      const correctIdx = q.correct_index;
      const feedback = document.getElementById('cert-feedback');
      if (chosenIdx === correctIdx) {
        state.score += 1;
        btnEl.classList.add('correct');
        feedback.textContent = 'Correct.';
      } else {
        btnEl.classList.add('wrong');
        feedback.textContent = 'Correct answer: ' + q.answers[correctIdx];
        const correctBtn = document.getElementById('cert-answer-' + correctIdx);
        if (correctBtn) correctBtn.classList.add('correct');
      }
      const all = document.querySelectorAll('.cert-answer');
      all.forEach(b => b.disabled = true);
      document.getElementById('cert-next').disabled = false;
      if (state.index + 1 >= state.questions.length) {
        document.getElementById('cert-next').textContent = 'Finish';
      }
    }

    function renderResult() {
      setMode('result');
      const total = state.questions.length;
      const score = state.score;
      const pct = Math.round((score / total) * 100);
      app.innerHTML = `
        <div class="cert-card cert-result">
          <div class="cert-result__score">${score} / ${total}</div>
          <div class="cert-result__sub">${pct}% on this run</div>
          <button class="cert-btn" type="button" id="cert-retry">Retry</button>
          <button class="cert-btn" type="button" id="cert-home">Domain menu</button>
          <div class="cert-controversy">${escapeHtml(data.meta?.controversy_note || '')}</div>
        </div>
      `;
      document.getElementById('cert-retry').addEventListener('click', () => {
        setDomain(state.domain);
        renderQuiz();
      });
      document.getElementById('cert-home').addEventListener('click', renderHome);
    }

    renderHome();
  }
  init();
})();
</script>
</body>
</html>
